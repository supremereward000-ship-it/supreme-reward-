  <style>

<body>
<div class="container" id="app">

  <!-- header -->
  <div class="header">
    <div class="logo">
      <i class="fas fa-crown"></i> Supreme <span>Store</span>
    </div>
    <div class="header-actions">
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search apps..." />
      </div>
      <!-- Admin link is hidden via CSS (display:none) -->
      <a href="admin.html" class="admin-link"><i class="fas fa-cog"></i> Admin</a>
    </div>
  </div>

  <!-- filters -->
  <div class="filter-group" id="filterGroup">
    <span class="filter-chip active" data-filter="all"><i class="fas fa-th-large"></i> All</span>
    <span class="filter-chip" data-filter="trending"><i class="fas fa-fire"></i> Trending</span>
    <span class="filter-chip" data-filter="new"><i class="fas fa-star"></i> New</span>
    <span class="filter-chip" data-filter="updated"><i class="fas fa-sync-alt"></i> Updated</span>
    <span class="filter-chip" data-filter="top"><i class="fas fa-chart-line"></i> Top</span>
  </div>

  <!-- app grid -->
  <div class="app-grid" id="appGrid"></div>

  <!-- Detail overlay -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-panel" id="detailPanel">
      <span class="close-detail" id="closeDetail"><i class="fas fa-times"></i></span>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- FIREBASE CONFIG ----------
    const firebaseConfig = {
      apiKey: "AIzaSyBzXsVe3LjZGE8C503J00KFAHT2vCrQBsg",
      authDomain: "supreme-reward-4bfb9.firebaseapp.com",
      databaseURL: "https://supreme-reward-4bfb9-default-rtdb.firebaseio.com",
      projectId: "supreme-reward-4bfb9",
      storageBucket: "supreme-reward-4bfb9.appspot.com",
      messagingSenderId: "597180617800",
      appId: "1:597180617800:web:98490f49e4600b932f747d",
      measurementId: "G-KXDFKFZKQL"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    const appsRef = database.ref('apps');

    // ---------- STATE ----------
    let allApps = [];
    let currentFilter = 'all';
    let filteredApps = [];

    // DOM refs
    const grid = document.getElementById('appGrid');
    const searchInput = document.getElementById('searchInput');
    const filterChips = document.querySelectorAll('.filter-chip');
    const detailOverlay = document.getElementById('detailOverlay');
    const detailContent = document.getElementById('detailContent');
    const closeDetail = document.getElementById('closeDetail');

    // ---------- HELPERS ----------
    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating - full >= 0.5 ? 1 : 0;
      let s = '';
      for (let i = 0; i < full; i++) s += '⭐';
      if (half) s += '✨';
      for (let i = full + half; i < 5; i++) s += '☆';
      return s;
    }

    // ---------- DOWNLOAD FUNCTION ----------
    function downloadAPK(apkLink, appName, appId) {
      if (!apkLink || apkLink.trim() === '') {
        alert('Download link is not available.');
        return;
      }

      try {
        const url = new URL(apkLink);
        if (url.protocol !== 'http:' && url.protocol !== 'https:') {
          alert('Invalid download link. Please contact support.');
          return;
        }
      } catch (e) {
        alert('Invalid download link. Please contact support.');
        return;
      }

      window.open(apkLink, '_blank');
      
      if (appId) {
        const app = allApps.find(a => a.id === appId);
        if (app) {
          const newCount = (app.downloads || 0) + 1;
          appsRef.child(appId).update({ downloads: newCount });
        }
      }
    }

    // ---------- CREATE CARD ----------
    function createCard(app) {
      const card = document.createElement('div');
      card.className = 'app-card';
      card.dataset.id = app.id;
      const hasApk = app.apkLink && app.apkLink.trim() !== '';
      
      // Handle icon display - improved to handle Firebase Storage URLs
      let iconHtml = '📱';
      if (app.icon) {
        const icon = app.icon;
        // Check if it's a URL (http, https, data:image)
        if (icon.startsWith('http://') || icon.startsWith('https://') || icon.startsWith('data:image')) {
          iconHtml = `<img src="${icon}" alt="${app.name}" onerror="this.parentElement.innerHTML='📱'" />`;
        } else {
          // It's an emoji or text
          iconHtml = icon;
        }
      }
      
      card.innerHTML = `
        <div class="card-top">
          <div class="app-icon">${iconHtml}</div>
          <div>
            <div class="app-name">${app.name || 'Unnamed'}</div>
            <div class="dev-name">${app.developer || 'Unknown'}</div>
          </div>
        </div>
        <div class="card-meta">
          <span><i class="fas fa-tag"></i> ${app.category || 'General'}</span>
          <span class="stars">${renderStars(app.rating || 0)}</span>
          <span><i class="fas fa-hdd"></i> ${app.size || 'N/A'}</span>
          <span><i class="fas fa-code-branch"></i> v${app.version || '1.0'}</span>
        </div>
        <div class="desc">${app.description || 'No description'}</div>
        <button class="download-btn ${!hasApk ? 'coming' : ''}" data-id="${app.id}" data-apk="${app.apkLink || ''}" data-name="${app.name || 'app'}">
          ${hasApk ? '<i class="fas fa-download"></i> Download' : '<i class="fas fa-clock"></i> Coming Soon'}
        </button>
      `;
      
      card.addEventListener('click', (e) => {
        if (e.target.closest('.download-btn')) return;
        openDetail(app.id);
      });
      
      const btn = card.querySelector('.download-btn');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const apk = btn.dataset.apk;
        const name = btn.dataset.name;
        const id = btn.dataset.id;
        
        if (!apk || apk.trim() === '') {
          alert('Download link is not available.');
          return;
        }
        
        btn.innerHTML = '<span class="spinner"></span> Starting…';
        btn.disabled = true;
        
        setTimeout(() => {
          downloadAPK(apk, name, id);
          btn.innerHTML = '<i class="fas fa-download"></i> Download';
          btn.disabled = false;
        }, 300);
      });
      
      return card;
    }

    // ---------- RENDER GRID ----------
    function renderApps(appList) {
      grid.innerHTML = '';
      if (!appList || appList.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#7f8fa3; padding:3rem 0;">No apps found</p>`;
        return;
      }
      // Filter out disabled apps
      const visibleApps = appList.filter(app => app.enabled !== false);
      visibleApps.forEach(app => {
        grid.appendChild(createCard(app));
      });
    }

    // ---------- FILTER + SEARCH ----------
    function applyFilters() {
      if (!allApps.length) {
        renderApps([]);
        return;
      }
      let filtered = [...allApps];
      const q = searchInput.value.toLowerCase().trim();
      if (q) {
        filtered = filtered.filter(app => 
          (app.name || '').toLowerCase().includes(q) || 
          (app.developer || '').toLowerCase().includes(q) ||
          (app.category || '').toLowerCase().includes(q)
        );
      }
      if (currentFilter !== 'all') {
        if (currentFilter === 'trending') filtered = filtered.filter(app => app.tags && app.tags.includes('trending'));
        else if (currentFilter === 'new') filtered = filtered.filter(app => app.tags && app.tags.includes('new'));
        else if (currentFilter === 'updated') filtered = filtered.filter(app => app.tags && app.tags.includes('updated'));
        else if (currentFilter === 'top') filtered = filtered.filter(app => app.tags && app.tags.includes('top'));
      }
      filteredApps = filtered;
      renderApps(filtered);
    }

    // ---------- DETAIL VIEW ----------
    function openDetail(appId) {
      const app = allApps.find(a => a.id === appId);
      if (!app) return;
      const hasApk = app.apkLink && app.apkLink.trim() !== '';
      
      let iconHtml = '📱';
      if (app.icon) {
        const icon = app.icon;
        if (icon.startsWith('http://') || icon.startsWith('https://') || icon.startsWith('data:image')) {
          iconHtml = `<img src="${icon}" alt="${app.name}" onerror="this.parentElement.innerHTML='📱'" />`;
        } else {
          iconHtml = icon;
        }
      }
      
      detailContent.innerHTML = `
        <div class="detail-header">
          <div class="detail-icon">${iconHtml}</div>
          <div>
            <div class="detail-title">${app.name || 'Unnamed'}</div>
            <div class="detail-dev"><i class="fas fa-user-astronaut"></i> ${app.developer || 'Unknown'}</div>
          </div>
        </div>
        <div class="detail-meta-grid">
          <span><i class="fas fa-code-branch"></i> v${app.version || '1.0'}</span>
          <span><i class="fas fa-hdd"></i> ${app.size || 'N/A'}</span>
          <span><i class="fas fa-calendar-alt"></i> ${app.lastUpdated || 'N/A'}</span>
          <span><i class="fas fa-android"></i> ${app.androidRequired || 'N/A'}</span>
          <span><i class="fas fa-star"></i> ${app.rating || 0} (${app.downloads || 0} DL)</span>
        </div>
        <div class="detail-desc">${app.description || 'No description'}</div>
        <div class="detail-screenshots">
          ${app.screenshots ? app.screenshots.map(s => `<span style="background:#1f2838; padding:0.6rem 1.1rem; border-radius:20px; font-size:1.6rem;">${s}</span>`).join('') : ''}
        </div>
        <div class="detail-features">
          <i class="fas fa-check-circle"></i> Features<br>
          ${app.features && app.features.length ? app.features.map(f => `• ${f}`).join('<br>') : 'No features listed'}
        </div>
        <div class="changelog"><i class="fas fa-history"></i> ${app.changelog || 'No changelog'}</div>
        <button class="download-big ${!hasApk ? 'coming' : ''}" data-apk="${app.apkLink || ''}" data-id="${app.id}" data-name="${app.name || 'app'}" id="detailDownloadBtn">
          ${hasApk ? '<i class="fas fa-download"></i> Download APK' : '<i class="fas fa-clock"></i> Download Coming Soon'}
        </button>
      `;
      detailOverlay.classList.add('active');
      
      const bigBtn = document.getElementById('detailDownloadBtn');
      if (bigBtn) {
        bigBtn.addEventListener('click', () => {
          const apk = bigBtn.dataset.apk;
          const id = bigBtn.dataset.id;
          const name = bigBtn.dataset.name;
          
          if (!apk || apk.trim() === '') {
            alert('Download link is not available.');
            return;
          }
          
          bigBtn.innerHTML = '<span class="spinner"></span> Starting…';
          bigBtn.disabled = true;
          
          setTimeout(() => {
            downloadAPK(apk, name, id);
            bigBtn.innerHTML = '<i class="fas fa-download"></i> Download APK';
            bigBtn.disabled = false;
          }, 300);
        });
      }
    }

    function closeDetailPanel() {
      detailOverlay.classList.remove('active');
    }

    // ---------- LOAD DATA FROM FIREBASE (REAL-TIME) ----------
    function loadAppsFromFirebase() {
      appsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const appsArray = Object.keys(data).map(key => {
            return { id: key, ...data[key] };
          });
          allApps = appsArray;
        } else {
          allApps = [];
        }
        applyFilters();
      });
    }

    // ---------- EVENT LISTENERS ----------
    searchInput.addEventListener('input', applyFilters);

    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        filterChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        applyFilters();
      });
    });

    closeDetail.addEventListener('click', closeDetailPanel);
    detailOverlay.addEventListener('click', (e) => {
      if (e.target === detailOverlay) closeDetailPanel();
    });

    // ---------- START ----------
    loadAppsFromFirebase();
  })();
</script>
</body>
</html>
